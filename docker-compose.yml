# Mockifyr — single-image mock server.
#
#   docker compose up
#
# Put your WireMock *.json stub files in ./mappings — they're loaded on startup and new stubs
# created via the dashboard/admin API are persisted back there. In-memory serving, file-backed mappings.
# For durable Postgres persistence, uncomment the `postgres` service and swap the mockifyr
# `command:` for the Postgres one below.

services:
  mockifyr:
    image: ghcr.io/qorpe/mockifyr:latest
    # build: .            # uncomment to build from source instead of pulling the published image
    ports:
      - "8080:8080"
    volumes:
      # The file store keeps everything under /work: stubs (mappings/), environment configuration
      # (environments/), response body files (__files/) and gRPC descriptors (grpc/). The named volume
      # keeps all of it across container recreation; the bind below overlays just the stubs so your
      # *.json files stay in ./mappings, next to you. Mounting only /work/mappings would silently lose
      # the environment configuration on recreate (issue #181).
      - mockifyr-data:/work
      - ./mappings:/work/mappings
    # Durable Postgres instead of file-based — uncomment this command and the postgres service:
    # command: ["--postgres", "Host=postgres;Username=mockifyr;Password=mockifyr;Database=mockifyr", "--change-feed"]
    # depends_on:
    #   - postgres

  # postgres:
  #   image: postgres:16-alpine
  #   environment:
  #     POSTGRES_USER: mockifyr
  #     POSTGRES_PASSWORD: mockifyr
  #     POSTGRES_DB: mockifyr
  #   volumes:
  #     - pgdata:/var/lib/postgresql/data

volumes:
  mockifyr-data:
  # pgdata:            # uncomment together with the postgres service
