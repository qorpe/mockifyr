{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "mockifyr.fullname" . }}
  labels: {{- include "mockifyr.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "mockifyr.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    {{- if .Values.networkPolicy.restrictEgress }}
    - Egress
    {{- end }}
  ingress:
    - ports:
        - protocol: TCP
          port: {{ .Values.service.port }}
        {{- range .Values.networkPolicy.extraIngressPorts }}
        - protocol: TCP
          port: {{ . }}
        {{- end }}
      {{- with .Values.networkPolicy.ingressFrom }}
      from: {{- toYaml . | nindent 8 }}
      {{- end }}
{{- if .Values.networkPolicy.restrictEgress }}
  # Egress is the half people get wrong. This host calls out by design — webhooks and proxy targets,
  # the persistence backend, Kafka/AMQP, an SMTP server, an OIDC issuer — so a policy that pins only
  # ingress turns a working install into a silently broken one, and the symptom (requests that hang,
  # then time out) points nowhere near the policy.
  #
  # DNS is emitted unconditionally: a rule set without it fails before anything else does, and the
  # operator who forgets it debugs name resolution rather than the policy that broke it.
  egress:
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    {{- with .Values.networkPolicy.egressTo }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
{{- end }}
