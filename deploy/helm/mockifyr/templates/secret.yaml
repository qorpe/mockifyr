{{- if and .Values.adminAuth.enabled (not .Values.adminAuth.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ printf "%s-admin" (include "mockifyr.fullname" .) }}
  labels: {{- include "mockifyr.labels" . | nindent 4 }}
type: Opaque
stringData:
  admin-user: {{ .Values.adminAuth.username | quote }}
  # A generated password is kept across upgrades: regenerating it on every `helm upgrade` would
  # silently lock out every client that stored the old one.
  admin-pass: {{ .Values.adminAuth.password | default (index (lookup "v1" "Secret" .Release.Namespace (printf "%s-admin" (include "mockifyr.fullname" .)) | default dict) "data" | default dict | dig "admin-pass" "" | b64dec | default (randAlphaNum 24)) | quote }}
{{- end }}
{{- if and (not .Values.cryptography.existingSecret) (or .Values.cryptography.decryptKey .Values.cryptography.signKey) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ printf "%s-crypto" (include "mockifyr.fullname" .) }}
  labels: {{- include "mockifyr.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- with .Values.cryptography.decryptKey }}
  decrypt-key: {{ . | quote }}
  {{- end }}
  {{- with .Values.cryptography.signKey }}
  sign-key: {{ . | quote }}
  {{- end }}
{{- end }}
