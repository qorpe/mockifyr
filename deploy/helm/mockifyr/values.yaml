# Mockifyr — deployment values. Every flag the host understands is reachable from here; the ones an
# operator sets most often have their own key, and `extraArgs` covers the rest without a chart change.

image:
  repository: ghcr.io/qorpe/mockifyr
  tag: ""            # defaults to .Chart.AppVersion
  pullPolicy: IfNotPresent

replicaCount: 1

service:
  type: ClusterIP
  port: 8080

# The dashboard is served under /__mockifyr by the image's entrypoint.
ingress:
  enabled: false
  className: ""
  host: mockifyr.example.com
  tls: false
  annotations: {}

# OpenShift Route (ignored on plain Kubernetes).
route:
  enabled: false
  host: ""

# Durable state at /work — stubs, environments, response files, gRPC descriptors, API keys.
persistence:
  enabled: false
  size: 1Gi
  storageClass: ""
  # A datastore flag takes precedence over the file store when set.
  postgres: ""       # --postgres <connection string>
  redis: ""          # --redis <connection string>

# Admin API credentials. Leave empty to run without auth (development only) — the host prints a
# startup warning in that case, and the chart refuses to expose an Ingress without credentials.
adminAuth:
  enabled: true
  username: admin
  password: ""             # generated when empty and `existingSecret` is not set
  existingSecret: ""       # a Secret with keys: admin-user, admin-pass

# Sandbox API keys (mfk_…): per-consumer credentials with hourly quotas.
sandboxAuth:
  enabled: false

# Payload cryptography and signing (256-bit base64 keys). Prefer existingSecret in real deployments.
cryptography:
  decryptKey: ""
  signKey: ""
  existingSecret: ""       # a Secret with keys: decrypt-key, sign-key
  # Mount the Secret as files and point the host at them instead of passing keys as arguments (#250).
  # This is what makes rotation work without a restart: updating the Secret rewrites the mounted
  # file, the host re-reads it, and no key ever appears in the pod's command line. A mounted key
  # file may hold several keys, newest first, so a rollover is "add the new key, drain, remove the
  # old" rather than a coordinated restart.
  mountAsFiles: false
  reloadSeconds: 10        # how often a mounted key file is re-read

# Retention bounds — the defaults match the host's own.
limits:
  journal: 1000
  messages: 1000
  resources: 1000

# Observability (#246). The scrape endpoint rides on the existing service port at
# /__admin/metrics and needs no credentials, so a Prometheus scraper works out of the box.
metrics:
  enabled: false
  serviceMonitor:
    enabled: false          # requires metrics.enabled and the Prometheus operator
    interval: 30s
    labels: {}              # e.g. release: kube-prometheus-stack

# OTLP endpoint for traces and metrics, e.g. http://otel-collector:4317
otelEndpoint: ""

# Structured JSON logs for a log pipeline (SIEM, Loki, Elastic).
logJson: false

# Admin audit trail (#247): who changed what, at /__admin/audit and as an admin.audit log line.
# The in-memory trail dies with the pod on purpose — enable logJson so the SIEM keeps the durable
# copy, and let its retention policy, not this bound, decide how long history lives.
audit:
  enabled: false
  limit: 1000

# Anything else, verbatim: e.g. ["--block-outbound-routes", "true"]
extraArgs: []

resources:
  requests:
    cpu: 100m
    memory: 192Mi
  limits:
    memory: 512Mi

# Probes use the unauthenticated endpoints (#242): liveness never fails on a slow dependency,
# readiness turns off while the pod drains.
probes:
  liveness:
    initialDelaySeconds: 5
    periodSeconds: 10
  readiness:
    initialDelaySeconds: 2
    periodSeconds: 5

podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false   # /work is written by the file store
  capabilities:
    drop: ["ALL"]

nodeSelector: {}
tolerations: []
affinity: {}
podAnnotations: {}
