name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    name: Build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release

      # --logger trx so a failure keeps its NAME. The console logger prints a summary and lets the
      # detail scroll past, which is how an intermittent red once cost a diagnosis: all that survived
      # was "1 failed" (#320).
      - name: Test (unit)
        run: dotnet test --no-build -c Release --filter "FullyQualifiedName!~Differential" --logger "trx" --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-unit
          path: TestResults/
          if-no-files-found: ignore

  benchmarks:
    name: Engine benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # A short run, on a shared runner. The numbers here are NOT the published envelope — that comes
      # from a stated machine (docs/parity/performance.md). This job exists so that a change which
      # makes the engine's hot path throw, allocate unboundedly, or stop compiling is visible on the
      # pull request that caused it, rather than at the next release measurement.
      - name: Run (quick)
        run: dotnet run --project bench/Mockifyr.Benchmarks -c Release -- --quick --filter '*'

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-results
          path: BenchmarkDotNet.Artifacts/results/
          if-no-files-found: ignore

  security:
    name: Security scans
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write   # publish CodeQL and Trivy findings to the Security tab
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # Known-vulnerable NuGet packages, including transitive ones. Fails the build so a dependency
      # bump that introduces a CVE is caught here rather than by a customer's scanner.
      - name: Audit NuGet dependencies
        run: |
          dotnet restore
          dotnet list package --vulnerable --include-transitive 2>&1 | tee nuget-audit.txt
          if grep -qE "Critical|High" nuget-audit.txt; then
            echo "::error::A dependency with a High/Critical advisory is referenced — see the table above."
            exit 1
          fi

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml

      - name: Audit dashboard dependencies
        working-directory: ui
        run: |
          pnpm install --frozen-lockfile
          pnpm audit --audit-level high

      # The image as it will ship: OS packages and the runtime layer, not just our code.
      - name: Build the image for scanning
        run: docker build -t mockifyr:scan .

      # Trivy from its own pinned image rather than an install script: no PATH or permission
      # surprises on the runner, and the scanner version is explicit. The docker socket lets it read
      # the image we just built locally; the cache mount keeps the vulnerability DB between runs.
      # ignore-unfixed: a base-image CVE with no available fix cannot be actioned in a pull request,
      # and failing on it would only teach everyone to ignore this job.
      - name: Scan the image
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "${HOME}/.cache/trivy:/root/.cache/trivy" \
            aquasec/trivy:0.58.1 image \
              --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 \
              --format table mockifyr:scan

  chart:
    name: Helm chart (lint & posture)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: azure/setup-helm@v5

      - name: Lint
        run: helm lint deploy/helm/mockifyr

      # The chart's security promises are configuration, so they regress silently in a template
      # edit. This asserts them (non-root, dropped capabilities, probe paths, secret-only
      # credentials, an Ingress that refuses to expose an unauthenticated admin API).
      - name: Verify posture
        run: python3 deploy/helm/verify-chart.py

      # The kubeconform image is built FROM scratch, so it cannot run a shell pipeline — install the
      # released binary and feed it a rendered file instead.
      - name: Validate against Kubernetes schemas
        run: |
          curl -sSLo kubeconform.tar.gz https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz
          tar -xzf kubeconform.tar.gz kubeconform
          helm template verify deploy/helm/mockifyr --set persistence.enabled=true --set ingress.enabled=true > rendered.yaml
          ./kubeconform -strict -summary -skip Route rendered.yaml

  ui:
    name: Dashboard (build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Kit freshness (@qorpe/ui)
        # The dashboard composes the family kit; falling silently behind it is how one
        # console drifts out of the family. Skips honestly when the registry is
        # unreachable (air-gapped), red when the pin is genuinely stale.
        working-directory: .
        run: ./scripts/kit-freshness.sh

      - name: Lint
        # CLAUDE.md §3a demands tsc/lint/build for every UI change; CI ran only build,
        # so the one gate that reads the code for smells was never actually a gate.
        run: pnpm lint

      - name: Build (type-check + bundle)
        run: pnpm build

  differential:
    name: Differential (WireMock oracle)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # Pre-pull the pinned oracle image (WireMockOracle.Image) with a bounded retry, so a
      # transient Docker registry hiccup (e.g. an HTTP 500 or Docker Hub rate limit) during image
      # acquisition is retried at the infrastructure layer instead of failing the run. This only
      # hardens the pull — the differential test below still runs exactly once and stays the sole
      # arbiter of parity.
      - name: Pre-pull oracle image (retry on transient registry errors)
        run: |
          image=wiremock/wiremock:3.10.0
          for attempt in 1 2 3 4 5; do
            if docker pull "$image"; then exit 0; fi
            wait=$((attempt * 5))
            echo "pull attempt $attempt for $image failed; retrying in ${wait}s" >&2
            sleep "$wait"
          done
          echo "oracle image pull failed after 5 attempts" >&2
          exit 1

      # GitHub-hosted ubuntu runners include Docker; Testcontainers starts the oracle.
      # TESTCONTAINERS_RYUK_DISABLED skips the Ryuk resource-reaper container: its only job is to
      # clean up leftover containers after the run, which is moot on an ephemeral runner that is
      # discarded anyway. Disabling it removes a second registry pull (the one that flaked) without
      # touching what the tests validate.
      - name: Differential tests (real WireMock via Testcontainers)
        run: dotnet test tests/Mockifyr.Differential.Tests -c Release --logger "trx" --results-directory TestResults
        env:
          TESTCONTAINERS_RYUK_DISABLED: "true"

      # Uploaded on success too: a suite that is green in aggregate can still hold the run where a
      # flake did NOT fire, and comparing the two is how the next one gets characterised.
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-differential
          path: TestResults/
          if-no-files-found: ignore
