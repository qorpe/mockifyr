<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Mockifyr">
  <title>Mockifyr</title>
  <!-- Optical size for 16px, not the master scaled down: same skeleton, but stroke 18 -> 30 and the
       mark fills 94% of the box, which puts the line on ~2.3px at tab scale instead of a sub-pixel
       1.4px that renders as grey haze beside neighbours that are solid shapes. The heavier stroke
       still leaves daylight between each brace and the point, which is what keeps the glyph from
       welding into one lump. No tile — a tab strip already has a background, and a white square
       reads as a white square on every tab that is not active. Transparent instead means the ink
       has to carry itself, so it follows the browser's theme rather than assuming a light one. -->
  <style>
    .ink { stroke: #111111 }
    .dot { fill: #0a4ecf }
    @media (prefers-color-scheme: dark) {
      .ink { stroke: #ffffff }
      .dot { fill: #5a8dff }
    }
  </style>
  <g transform="translate(3.72 13.95) scale(0.3008)">
    <g class="ink" fill="none" stroke-width="30" stroke-linecap="round" stroke-linejoin="round">
      <path d="M57 9 C29 9 33 49 9 60 C33 71 29 111 57 111"/>
      <path d="M131 9 C159 9 155 49 179 60 C155 71 159 111 131 111"/>
    </g>
    <circle class="dot" cx="94" cy="60" r="14"/>
  </g>
</svg>
