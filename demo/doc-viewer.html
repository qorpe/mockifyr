<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mockifyr — Doc</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#EEF0F1; --paper-2:#F7F8F8; --ink:#131C24; --slate:#5A6873;
    --rule:#C4CBD1; --flow:#0E6E70; --warn:#A8481D;
    --mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
    --sans:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    --cond:"IBM Plex Sans Condensed","IBM Plex Sans",sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);
    font-family:var(--sans);font-size:15.5px;line-height:1.65;
    background-image:
      linear-gradient(to right,rgba(19,28,36,.035) 1px,transparent 1px),
      linear-gradient(to bottom,rgba(19,28,36,.035) 1px,transparent 1px);
    background-size:28px 28px}
  .wrap{max-width:820px;margin:0 auto;padding:40px 20px 96px}
  .top{font-family:var(--mono);font-size:11px;letter-spacing:.1em;
    color:var(--flow);display:flex;justify-content:space-between;align-items:center;
    border-bottom:1px solid var(--ink);padding-bottom:14px;margin-bottom:8px}
  .top a{color:var(--slate);text-decoration:none;border:1px solid var(--rule);padding:4px 12px}
  .top a:hover{color:var(--ink);border-color:var(--ink)}
  h1{font-family:var(--cond);font-weight:700;font-size:clamp(26px,5vw,40px);
    line-height:1.1;letter-spacing:-.015em;margin:26px 0 10px}
  h2{font-family:var(--cond);font-weight:700;font-size:22px;margin:34px 0 8px;
    border-top:1px solid var(--rule);padding-top:22px}
  h3{font-size:16px;margin:22px 0 6px}
  p{margin:0 0 12px;max-width:72ch}
  li{margin-bottom:6px}
  code{font-family:var(--mono);font-size:.86em;background:rgba(14,110,112,.08);
    padding:1px 6px;border-radius:2px;color:#0a5658}
  pre{background:#0E1116;color:#C9D4DE;border:1px solid var(--ink);padding:14px 18px;
    overflow-x:auto;font-family:var(--mono);font-size:12.5px;line-height:1.7;margin:14px 0}
  pre code{background:none;padding:0;color:inherit}
  table{border-collapse:collapse;width:100%;margin:14px 0;font-size:14px}
  th{font-family:var(--mono);font-size:11px;letter-spacing:.06em;
    color:var(--flow);text-align:left;padding:8px 12px;border-bottom:2px solid var(--ink)}
  td{padding:9px 12px;border-bottom:1px solid var(--rule);vertical-align:top}
  a{color:var(--flow)}
  blockquote{border-left:2px solid var(--flow);margin:14px 0;padding:4px 0 4px 16px;color:var(--slate)}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><span>Mockifyr · Deep dive</span><a href="/">← Demo ekranı</a></div>
  <div id="md">Loading…</div>
</div>
<script>
  // minimal markdown renderer — headings, fences, inline code, bold, links, lists, tables, quotes
  function render(md){
    const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;');
    const inline = s => esc(s)
      .replace(/`([^`]+)`/g, (_,c)=>'<code>'+c+'</code>')
      .replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>')
      .replace(/\[([^\]]+)\]\(([^)]+)\)/g, (_,t,h)=>{
        const href = h.endsWith('.md') ? '/doc?d=' + h.replace('.md','') : h;
        return '<a href="'+href+'">'+t+'</a>';
      });
    const lines = md.split('\n');
    let html = '', i = 0, list = null;
    const closeList = () => { if(list){ html += '</'+list+'>'; list = null; } };
    while(i < lines.length){
      const L = lines[i];
      if(L.startsWith('```')){
        closeList();
        let body = [];
        i++;
        while(i < lines.length && !lines[i].startsWith('```')){ body.push(lines[i]); i++; }
        html += '<pre><code>'+esc(body.join('\n'))+'</code></pre>';
        i++; continue;
      }
      if(/^\|/.test(L)){
        closeList();
        const rows = [];
        while(i < lines.length && /^\|/.test(lines[i])){ rows.push(lines[i]); i++; }
        const cells = r => r.replace(/^\||\|$/g,'').split('|').map(c=>inline(c.trim()));
        html += '<table><tr>' + cells(rows[0]).map(c=>'<th>'+c+'</th>').join('') + '</tr>';
        rows.slice(2).forEach(r=>{ html += '<tr>' + cells(r).map(c=>'<td>'+c+'</td>').join('') + '</tr>'; });
        html += '</table>'; continue;
      }
      if(/^### /.test(L)){ closeList(); html += '<h3>'+inline(L.slice(4))+'</h3>'; }
      else if(/^## /.test(L)){ closeList(); html += '<h2>'+inline(L.slice(3))+'</h2>'; }
      else if(/^# /.test(L)){ closeList(); html += '<h1>'+inline(L.slice(2))+'</h1>';
        document.title = 'Mockifyr — ' + L.slice(2); }
      else if(/^> /.test(L)){ closeList(); html += '<blockquote>'+inline(L.slice(2))+'</blockquote>'; }
      else if(/^[-*] /.test(L)){ if(list!=='ul'){ closeList(); html+='<ul>'; list='ul'; }
        html += '<li>'+inline(L.slice(2))+'</li>'; }
      else if(/^\d+\. /.test(L)){ if(list!=='ol'){ closeList(); html+='<ol>'; list='ol'; }
        html += '<li>'+inline(L.replace(/^\d+\. /,''))+'</li>'; }
      else if(L.trim()===''){ closeList(); }
      else if(list){ // wrapped continuation of the previous list item
        html = html.replace(/<\/li>$/, ' ' + inline(L.trim()) + '</li>'); }
      else { html += '<p>'+inline(L)+'</p>'; }
      i++;
    }
    closeList();
    return html;
  }
  const name = new URLSearchParams(location.search).get('d') || 'sandbox';
  fetch('/docs/' + name + '.md').then(r=>{
    if(!r.ok) throw 0;
    return r.text();
  }).then(md=>{ document.getElementById('md').innerHTML = render(md); })
    .catch(()=>{ document.getElementById('md').textContent = 'Doc not found: ' + name; });
</script>
</body>
</html>
