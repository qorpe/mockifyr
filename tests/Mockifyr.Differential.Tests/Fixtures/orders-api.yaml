openapi: 3.0.3
info:
  title: Orders API
  version: 2.1.0
paths:
  /api/orders:
    get:
      operationId: listOrders
      responses:
        '200':
          description: all orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Order'
    post:
      operationId: createOrder
      responses:
        '201':
          description: created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
  /api/orders/{orderId}:
    get:
      operationId: getOrder
      responses:
        '200':
          description: one order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
    put:
      operationId: replaceOrder
      responses:
        '200':
          description: replaced
    delete:
      operationId: deleteOrder
      responses:
        '204':
          description: removed
  /api/orders/{orderId}/invoice:
    get:
      operationId: getInvoice
      responses:
        '200':
          description: the invoice PDF metadata
          content:
            application/json:
              schema:
                type: object
                properties:
                  url: { type: string, format: uri }
                  issued: { type: string, format: date }
  /api/health:
    get:
      operationId: health
      responses:
        '200':
          description: ok
          content:
            application/json:
              example: { status: up }
components:
  schemas:
    Order:
      type: object
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [created, shipped, delivered] }
        total: { type: number }
        paid: { type: boolean }
